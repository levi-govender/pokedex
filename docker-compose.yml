services:
  postgres:
    image: postgres:16-alpine
    container_name: pokedex-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-pokedex}
      POSTGRES_USER: ${DATABASE_USERNAME:-pokedex}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-pokedex}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-pokedex} -d ${DATABASE_NAME:-pokedex}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: pokedex-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-pokedex}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-pokedex}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-pokedex}
      POKEDEX_POKEAPI_BASE_URL: ${POKEDEX_POKEAPI_BASE_URL:-https://pokeapi.co/api/v2}
      PORT: ${PORT:-8080}
    ports:
      - "${PORT:-8080}:8080"

volumes:
  postgres-data:
