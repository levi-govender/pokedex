spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pokedex}
    username: ${DATABASE_USERNAME:pokedex}
    password: ${DATABASE_PASSWORD:pokedex}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
