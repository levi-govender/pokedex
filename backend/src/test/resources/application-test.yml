spring:
  datasource:
    url: ${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/pokedex_test}
    username: ${TEST_DATABASE_USERNAME:pokedex}
    password: ${TEST_DATABASE_PASSWORD:pokedex}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
